<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyFlow | Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="sass/main.css" />
  </head>
  <body class="sf-app-body">
    <div class="sf-dashboard-layout">
      <!-- ─── Left Sidebar Navigation ──────────────────────────────────── -->
      <aside class="sf-sidebar" id="sf-sidebar">
        <!-- App Logo & Brand -->
        <div class="sf-sidebar-brand">
          <img
            src="assets/icons/logo.png"
            alt="StudyFlow Logo"
            class="sf-brand-logo"
          />
          <span class="sf-brand-name"
            ><span class="sf-white">Study</span
            ><span class="sf-blue">Flow</span></span
          >
        </div>

        <!-- Primary Nav Items -->
        <nav class="sf-nav-menu">
          <a href="index.html" class="sf-nav-item active">
            <svg
              width="18"
              height="18"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2.2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
              />
            </svg>
            <span>Dashboard</span>
          </a>

          <a href="pages/glossary.html" class="sf-nav-item">
            <svg
              width="18"
              height="18"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2.2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"
              />
            </svg>
            <span>Global Glossary</span>
          </a>

          <a href="pages/chat.html" class="sf-nav-item sf-ai-pill">
            <svg
              width="18"
              height="18"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2.2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"
              />
            </svg>
            <span>AI Tutor Chat</span>
          </a>
          <a href="#quizzes" class="sf-nav-item">
            <svg
              width="18"
              height="18"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2.2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
              />
            </svg>
            <span>Quizzes</span>
          </a>
        </nav>

        <!-- Sidebar Footer Settings -->
        <div class="sf-sidebar-footer">
          <a href="#settings" class="sf-nav-item">
            <svg
              width="18"
              height="18"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2.2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
              />
            </svg>
            <span>Settings</span>
          </a>
        </div>
      </aside>

      <!-- ─── Main Content Workspace ───────────────────────────────────── -->
      <main class="sf-main-workspace">
        <!-- Top Workspace Bar -->
        <header class="sf-top-header">
          <div>
            <button class="sf-mobile-menu-btn" id="sf-sidebar-toggle">
              <svg
                width="20"
                height="20"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M4 6h16M4 12h16M4 18h16"
                />
              </svg>
            </button>
            <div class="sf-greeting-block">
              <h1 class="sf-greeting-title">Hello, Student! 👋</h1>
              <p class="sf-greeting-subtitle">
                Ready to continue your learning journey?
              </p>
            </div>
          </div>

          <div class="sf-header-actions">
            <a
              href="pages/chat.html"
              class="sf-header-ai-btn"
              title="Open Fullscreen AI Chat"
            >
              <!-- <span class="sf-sparkle">&#9733;</span> -->
              <span>Ask AI Tutor</span>
            </a>
            <button class="sf-icon-badge-btn" title="Notifications">
              <svg
                width="18"
                height="18"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
                />
              </svg>
            </button>
            <div class="sf-user-avatar" title="Ridwan • FUGUS Student">R</div>
          </div>
        </header>

        <!-- Dashboard Core Grid Layout (Laptop Screen matching Reference) -->
        <div class="sf-dashboard-grid">
          <!-- ── Column 1 & 2: Primary Study Feed ──────────────────────── -->
          <div class="sf-primary-column">
            <!-- All Courses Detailed Grid -->
            <section class="sf-all-courses-wrap" id="courses-grid">
              <div class="sf-section-header">
                <h2 class="sf-section-title">All Enrolled Courses</h2>
                <span class="sf-sub-tag">FUGUS 200L Second Semester</span>
              </div>
              <div id="courses-container" class="courses-grid">
                <!-- Dynamically populated from coursesData via app.js -->
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>

    <script src="js/app.js" type="module"></script>
  </body>
</html>
