                width="20"
                height="20"
                fill="none"
                viewBox="0 0 24 24"

                />

              <nav aria-label="Breadcrumb" style="margin-bottom: 0.2rem;">

                <span style="color: var(--border-strong); margin: 0 0.35rem; font-size: 0.76rem;">/</span>
                <span style="color: var(--brand-cyan); font-size: 0.76rem; font-weight: 700;">Courses</span>

            </div>
          </div>

          <div class="sf-header-actions">
            <button
              class="sf-search-cmd-btn sf-cmd-trigger"
              id="global-search-btn"
              title="Quick Search (Ctrl + K)"
              aria-label="Quick Search"
            >
              <svg
                width="15"
                height="15"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2.2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                />
              </svg>
              <span>Search</span>
              <kbd>Ctrl+K</kbd>
            </button>
            <a
              href="chat.html"
              class="sf-header-ai-btn"
              title="Ask AI Tutor"
            >
              <span class="sf-sparkle">✦</span>

        <!-- All Courses Detailed Grid & Filter Toolbar -->
        <section class="sf-all-courses-wrap" id="courses-grid" style="padding-top: 1rem;">
          <!-- Interactive Toolbar: Live Search & Category Pills -->
          <div class="sf-course-controls">
            <div class="sf-course-search-wrap">
              <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
              <input
                type="text"
                id="course-search-input"
                placeholder="Search courses by code or title (e.g. COS201, Architecture, Calculus)..."
                aria-label="Search courses"
              />
              <button id="course-search-clear" class="sf-search-clear-btn" style="display: none;" title="Clear search">✕</button>
            </div>

            <div class="sf-course-filter-row">
              <div class="sf-discipline-tabs" id="course-discipline-tabs">
                <button class="sf-discipline-chip active" data-discipline="all">All Disciplines</button>
                <button class="sf-discipline-chip" data-discipline="cs">Computer Science</button>
                <button class="sf-discipline-chip" data-discipline="math">Mathematics</button>
                <button class="sf-discipline-chip" data-discipline="gen">Entrepreneurship & Practicum</button>
              </div>
              <span class="sf-course-results-count" id="courses-filter-count">Showing 6 courses</span>
            </div>
          </div>

          <div id="courses-container" class="courses-grid">
            <!-- Dynamically populated from coursesData via app.js -->
          </div>
        </section>
      </main>

    <!-- Application Script -->
    <script type="module" src="../js/app.js"></script>

</html>
