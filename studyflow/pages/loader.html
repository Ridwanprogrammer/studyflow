<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        background: #050a14;
        color: #ffffff;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ─── Background ─────────────────────────────────────────────── */
      .loader-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: url("../assets/images/Study-(2)-no-logo.jpg") center/cover
          no-repeat;
        filter: brightness(0.35);
        animation: bgReveal 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes bgReveal {
        0% {
          opacity: 0;
          transform: scale(1.08);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* Dark overlay vignette */
      .loader-overlay {
        position: fixed;
        inset: 0;
        z-index: 1;
        background:
          radial-gradient(
            ellipse at center,
            transparent 30%,
            rgba(5, 10, 20, 0.75) 100%
          ),
          linear-gradient(to top, rgba(5, 10, 20, 0.6) 0%, transparent 50%);
      }

      /* ─── Content Container ──────────────────────────────────────── */
      .loader-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.2rem;
      }

      /* ─── Logo ───────────────────────────────────────────────────── */
      .loader-logo {
        width: 110px;
        height: 110px;
        opacity: 0;
        transform: translateY(40px) scale(0.7);
        animation: logoSlideIn 0.9s 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        filter: drop-shadow(0 0 30px rgba(1, 169, 254, 0.4));
      }
      @keyframes logoSlideIn {
        0% {
          opacity: 0;
          transform: translateY(40px) scale(0.7);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* ─── Brand Name ─────────────────────────────────────────────── */
      .loader-brand {
        display: flex;
        align-items: baseline;
        gap: 0;
        font-size: 3.5rem;
        font-weight: 900;
        letter-spacing: -2px;
        opacity: 0;
        transform: translateY(30px);
        animation: textSlideIn 0.8s 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .brand-study {
        color: #01a9fe;
      }
      .brand-flow {
        color: #3eaf00;
      }
      @keyframes textSlideIn {
        0% {
          opacity: 0;
          transform: translateY(30px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ─── Tagline ────────────────────────────────────────────────── */
      .loader-tagline {
        font-size: 1.15rem;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.6);
        letter-spacing: 1.5px;
        opacity: 0;
        transform: translateY(20px);
        animation: textSlideIn 0.7s 1.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* ─── Loading Bar ────────────────────────────────────────────── */
      .loader-bar-track {
        width: 220px;
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 4px;
        overflow: hidden;
        margin-top: 1.5rem;
        opacity: 0;
        animation: textSlideIn 0.5s 1.7s ease forwards;
      }
      .loader-bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 4px;
        background: linear-gradient(90deg, #01a9fe, #3eaf00);
        animation: barFill 2s 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @keyframes barFill {
        0% {
          width: 0%;
        }
        60% {
          width: 85%;
        }
        100% {
          width: 100%;
        }
      }

      /* ─── Fade-out (whole page) ───────────────────────────────────── */
      .loader-fadeout {
        animation: fadeOutAll 0.5s 4.2s ease forwards;
      }
      @keyframes fadeOutAll {
        0% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          pointer-events: none;
        }
      }

      /* ─── Glow pulse on logo ─────────────────────────────────────── */
      .loader-logo-wrap {
        position: relative;
      }
      .loader-logo-glow {
        position: absolute;
        inset: -20px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(1, 169, 254, 0.25) 0%,
          transparent 70%
        );
        opacity: 0;
        animation: glowPulse 2s 1s ease-in-out infinite;
      }
      @keyframes glowPulse {
        0%,
        100% {
          opacity: 0;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1.2);
        }
      }
    </style>
  </head>
  <body>
    <!-- Background -->
    <div class="loader-bg"></div>
    <div class="loader-overlay"></div>

    <!-- Centered content -->
    <div class="loader-content loader-fadeout">
      <!-- Logo with glow -->
      <div class="loader-logo-wrap">
        <div class="loader-logo-glow"></div>
        <img
          class="loader-logo"
          src="../assets/icons/logo.png"
          alt="StudyFlow Logo"
        />
      </div>

      <!-- Brand Name -->
      <div class="loader-brand">
        <span class="brand-study">Study</span
        ><span class="brand-flow">Flow</span>
      </div>

      <!-- Tagline -->
      <div class="loader-tagline">Smarter Study. Better Results.</div>

      <!-- Loading bar -->
      <div class="loader-bar-track">
        <div class="loader-bar-fill"></div>
      </div>
    </div>

    <!-- Redirect after animation -->
    <script>
      setTimeout(() => {
        window.location.href = "../index.html";
      }, 4700);
    </script>
  </body>
</html>
